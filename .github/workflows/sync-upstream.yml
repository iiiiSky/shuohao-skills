name: Sync fork with upstream

on:
  schedule:
    - cron: '0 17 * * *'   # 北京时间每天 01:00 自动同步 (UTC 17:00)
  workflow_dispatch: {}   # 支持手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Fetch upstream and merge (keep local commits)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/eternityspring/shuohao-skills.git
          git fetch upstream main
          if git merge --no-edit upstream/main >/tmp/merge.log 2>&1; then
            git push origin main
            echo "::notice::同步成功，已合并上游最新 main"
          else
            echo "::error::与上游合并产生冲突，未改动本地仓库，请手动处理"
            echo "----- merge log -----"
            cat /tmp/merge.log
            git merge --abort
            exit 1
          fi

      - name: Create next release (increment)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          FORK_REPO="iiiiSky/shuohao-skills"
          # 读取 fork 现有 tags，取最大 vX.Y.Z，patch+1；无则从 v0.1.0 开始
          TAGS=$(gh api "repos/$FORK_REPO/tags" --paginate --jq '.[].name' 2>/dev/null || true)
          NEW="v0.1.0"
          BEST="0.0.0"
          for t in $TAGS; do
            case "$t" in
              v[0-9]*.[0-9]*.[0-9]*)
                v=${t#v}
                if [ "$(printf '%s\n' "$v" "$BEST" | sort -V | tail -n1)" = "$v" ]; then
                  BEST="$v"
                fi
                ;;
            esac
          done
          if [ "$BEST" != "0.0.0" ]; then
            IFS=. read -r a b c <<< "$BEST"
            c=$((c+1))
            NEW="v${a}.${b}.${c}"
          fi
          echo "将创建 release: $NEW"
          if gh api "repos/$FORK_REPO/git/refs/tags/$NEW" >/dev/null 2>&1; then
            echo "::notice::tag $NEW 已存在，跳过"
          else
            HEAD=$(git rev-parse HEAD)
            gh api "repos/$FORK_REPO/git/refs" \
              -f ref="refs/tags/$NEW" -f sha="$HEAD" >/dev/null
            gh api "repos/$FORK_REPO/releases" \
              -f tag_name="$NEW" -f name="$NEW" \
              -F draft=false -F prerelease=false \
              -f body="> 自动同步上游 eternityspring/shuohao-skills 后发布的 $NEW" >/dev/null
            echo "::notice::已创建 release $NEW"
          fi
